    <rect x="1" y="2" width="10" height="3" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="6" cy="5" rx="5" ry="1.5" fill="#e0e7ff" opacity="0.9"/>
    
    <ellipse cx="6" cy="8" rx="5" ry="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="1" y="8" width="10" height="3" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="6" cy="11" rx="5" ry="1.5" fill="#e0e7ff" opacity="0.9"/>
  </g>
  
  <!-- Chart bars -->
  <g transform="translate(16, 10)">
    <rect x="0" y="8" width="3" height="8" rx="0.5" fill="#ffffff" opacity="0.95"/>
    <rect x="4" y="5" width="3" height="11" rx="0.5" fill="#ffffff" opacity="0.95"/>
