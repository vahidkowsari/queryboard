version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: queryboard-db
    environment:
      POSTGRES_DB: ${DB_NAME:-charting}
      POSTGRES_USER: ${DB_USER:-charting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-charting_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: queryboard-supertokens
    depends_on:
      - postgres
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${DB_USER:-charting}:${DB_PASSWORD:-charting_dev}@postgres:5432/${DB_NAME:-charting}
      ACCESS_TOKEN_VALIDITY: 900 # 15 minutes (seconds)
      REFRESH_TOKEN_VALIDITY: 10080 # 7 days (minutes)
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: queryboard-backend
    depends_on:
      - postgres
      - supertokens
    environment:
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-charting}
      DB_USER: ${DB_USER:-charting}
      DB_PASSWORD: ${DB_PASSWORD:-charting_dev}
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      API_DOMAIN: ${API_DOMAIN:-http://localhost}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:-http://localhost}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_DOMAIN: ${API_DOMAIN:-http://localhost}
    container_name: queryboard-frontend
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
